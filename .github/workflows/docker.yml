name: Publish Docker image

on:
  push:
    branches:
      - 'main'
      - 'v*'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'index.html'
  pull_request:
    paths:
      - '.github/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'index.html'
  # Called by release.yml, which pushes the image before it pushes the tag.
  workflow_call:
    inputs:
      version:
        description: 'Image version to publish (X.Y.Z)'
        required: true
        type: string
      ref:
        description: 'Commit to build'
        required: true
        type: string

jobs:
  prep:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tags: ${{ steps.prep.outputs.tags }}
      push: ${{ steps.prep.outputs.push }}
      main: ${{ steps.prep.outputs.main }}
      source: ${{ steps.prep.outputs.source }}
      revision: ${{ steps.prep.outputs.revision }}
    steps:
      -
        name: Prepare
        id: prep
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          DOCKER_IMAGE=ghcr.io/${{ github.repository }}
          VERSION=latest
          SHA=${INPUT_REF:-$GITHUB_SHA}
          SHORTREF=${SHA::8}
          PUSH=false
          MAIN=false

          # A release (called by release.yml), a git tag or a push to main
          # names the docker tag and is pushed; anything else is only built.
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION=$INPUT_VERSION
            PUSH=true
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            PUSH=true
          elif [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main ]]; then
            VERSION=main
            PUSH=true
            MAIN=true
          fi

          # main moves a single tag, so that the image it displaces is left
          # untagged for the cleanup job to remove.
          if [[ $MAIN == true ]]; then
            TAGS="${DOCKER_IMAGE}:main"
          else
            TAGS="${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:${SHORTREF}"
          fi

          # If the VERSION looks like a version number, assume that
          # this is the most recent version of the image and also
          # tag it 'latest'.
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:latest"
          fi

          # Set output parameters.
          {
            echo "tags=${TAGS}"
            echo "push=${PUSH}"
            echo "main=${MAIN}"
            echo "source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "revision=${SHA}"
          } >> "${GITHUB_OUTPUT}"

  # Pull requests and branch pushes only build, without write access to
  # packages.
  build:
    needs: prep
    if: needs.prep.outputs.push != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        # https://github.com/actions/checkout
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Docker Buildx (no push)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ needs.prep.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ needs.prep.outputs.source }}
            org.opencontainers.image.revision=${{ needs.prep.outputs.revision }}

  # v* tags, release.yml and pushes to main push the image.
  publish:
    needs: prep
    if: needs.prep.outputs.push == 'true'
    runs-on: ubuntu-latest
    # Pushes to main are serialized, so that an older commit finishing late
    # cannot move :main back.
    concurrency:
      group: ${{ needs.prep.outputs.main == 'true' && 'publish-main' || format('publish-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      -
        # https://github.com/actions/checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Docker Buildx (push)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prep.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ needs.prep.outputs.source }}
            org.opencontainers.image.revision=${{ needs.prep.outputs.revision }}

  # Deletes the images that :main left untagged. Tagged images and the
  # platform images of a multi-arch index are kept.
  cleanup:
    needs: [prep, publish]
    if: needs.prep.outputs.main == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    concurrency:
      group: ghcr-cleanup
      cancel-in-progress: false
    steps:
      -
        # https://github.com/dataaxiom/ghcr-cleanup-action
        # Pinned by commit, as it is given the right to delete images.
        name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-untagged: true
          validate: true
