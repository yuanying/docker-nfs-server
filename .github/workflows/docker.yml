name: Publish Docker image

on:
  push:
    branches:
      - 'main'
      - 'v*'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'index.html'
  pull_request:
    paths:
      - '.github/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'index.html'
  # Called by release.yml, which pushes the image before it pushes the tag.
  workflow_call:
    inputs:
      version:
        description: 'Image version to publish (X.Y.Z)'
        required: true
        type: string
      ref:
        description: 'Commit to build'
        required: true
        type: string

jobs:
  prep:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tags: ${{ steps.prep.outputs.tags }}
      push: ${{ steps.prep.outputs.push }}
    steps:
      -
        name: Prepare
        id: prep
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          DOCKER_IMAGE=ghcr.io/${{ github.repository }}
          VERSION=latest
          SHA=${INPUT_REF:-$GITHUB_SHA}
          SHORTREF=${SHA::8}
          PUSH=false

          # A release (called by release.yml) or a git tag names the docker tag
          # and is pushed; anything else is only built.
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION=$INPUT_VERSION
            PUSH=true
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            PUSH=true
          fi
          TAGS="${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:${SHORTREF}"

          # If the VERSION looks like a version number, assume that
          # this is the most recent version of the image and also
          # tag it 'latest'.
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:latest"
          fi

          # Set output parameters.
          {
            echo "tags=${TAGS}"
            echo "push=${PUSH}"
          } >> "${GITHUB_OUTPUT}"

  # Pull requests and branch pushes only build, without write access to
  # packages.
  build:
    needs: prep
    if: needs.prep.outputs.push != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        # https://github.com/actions/checkout
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Docker Buildx (no push)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ needs.prep.outputs.tags }}

  # v* tags and release.yml push the image.
  publish:
    needs: prep
    if: needs.prep.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        # https://github.com/actions/checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Docker Buildx (push)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prep.outputs.tags }}
