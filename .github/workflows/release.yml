name: Weekly release

# Once a week, cut vX.Y.(Z+1) if the image's files changed since the latest
# vX.Y.Z tag. The image is pushed first and the tag last, so a failed push
# leaves no tag behind. The build runs in this run because a tag pushed with
# GITHUB_TOKEN does not trigger docker.yml.
on:
  schedule:
    # Monday 09:00 JST
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Decide next version
        id: next
        run: .github/scripts/next-release.sh HEAD | tee -a "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ needs.plan.outputs.sha }}

  tag:
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Push tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${SHA}"
